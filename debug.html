<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DEBUG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar bg-danger navbar-dark px-3 py-2">
    <span class="navbar-brand mb-0 h6">DEBUG</span>
  </nav>

  <div id="errorArea" class="alert alert-danger mx-3 mt-3 py-2 d-none"></div>

  <div class="container py-4">
    <div class="mb-3">
      <label class="form-label">パスワード</label>
      <input type="text" id="password" class="form-control"
             autocorrect="off" autocapitalize="off" autocomplete="off"
             placeholder="パスワードを入力">
    </div>
    <button id="btnClear" class="btn btn-danger w-100">
      localStorage &amp; スプレッド全削除してリセット
    </button>
  </div>

  <script>
    const GAS_URL     = 'https://script.google.com/macros/s/AKfycbyrGE95bSjDTIJKAI8lMaYpE6oIJqecBZv4iCH2ULHXAgtjiBRzt72p4-QzU5vF_khh/exec';
    const STORAGE_KEY = 'mahjong-app-state';

    function showError(msg) {
      const el = document.getElementById('errorArea');
      el.textContent = msg;
      el.classList.toggle('d-none', !msg);
    }

    document.getElementById('btnClear').addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnClear');
      btn.disabled = true;
      btn.textContent = '処理中...';
      showError('');

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const spreadsheetId = raw ? JSON.parse(raw).spreadsheetId : null;

        if (spreadsheetId) {
          const res = await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'delete', password, spreadsheetId }),
          });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error);
        }

        localStorage.removeItem(STORAGE_KEY);
        location.href = '/mahjong-app/';
      } catch (err) {
        showError(err.message === 'Failed to fetch' ? '通信に失敗しました' : err.message);
        btn.disabled = false;
        btn.textContent = 'localStorage & スプレッド全削除してリセット';
      }
    });
  </script>
</body>
</html>
