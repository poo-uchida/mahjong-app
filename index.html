<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麻雀成績入力</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

  <!-- 共通ヘッダー -->
  <nav class="navbar bg-primary navbar-dark px-3 py-2">
    <span class="navbar-brand mb-0 h6">麻雀成績入力</span>
    <div class="d-flex align-items-center gap-2">
      <small id="pageIndicator" class="text-white-50"></small>
      <button id="btnSync" class="btn btn-sm btn-outline-light d-none">同期</button>
    </div>
  </nav>

  <!-- 共通エラー表示 -->
  <div id="errorArea" class="alert alert-danger mx-3 mt-3 py-2 d-none"></div>

  <!-- Page 0: ログイン -->
  <div id="page0" class="container py-4">
    <div class="mb-3">
      <label class="form-label">パスワード</label>
      <input type="text" id="password" class="form-control"
             autocorrect="off" autocapitalize="off" autocomplete="off"
             placeholder="パスワードを入力">
    </div>
    <button id="btnLogin" class="btn btn-primary w-100">ログイン</button>
  </div>

  <!-- Page 1: 設定 -->
  <div id="page1" class="container py-3 d-none">
    <div class="mb-3">
      <label class="form-label">日付</label>
      <input type="date" id="date" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">プレイヤー</label>
      <div class="row g-2">
        <div class="col-6"><input type="text" id="player0" class="form-control" placeholder="プレイヤー1"></div>
        <div class="col-6"><input type="text" id="player1" class="form-control" placeholder="プレイヤー2"></div>
        <div class="col-6"><input type="text" id="player2" class="form-control" placeholder="プレイヤー3"></div>
        <div class="col-6"><input type="text" id="player3" class="form-control" placeholder="プレイヤー4"></div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6">
        <label class="form-label">ウマ1（1位⇔4位）</label>
        <input type="number" id="inputUma1" class="form-control" value="10" inputmode="numeric">
      </div>
      <div class="col-6">
        <label class="form-label">ウマ2（2位⇔3位）</label>
        <input type="number" id="inputUma2" class="form-control" value="5" inputmode="numeric">
      </div>
    </div>

    <button id="btnStart" class="btn btn-primary w-100" disabled>ゲーム開始</button>
  </div>

  <!-- Page 2: 素点入力 -->
  <div id="page2" class="container py-3 d-none">
    <p class="fw-bold mb-2" id="p2RoundLabel"></p>
    <div class="table-responsive mb-2">
      <table class="table table-sm table-bordered mb-0">
        <thead class="table-light">
          <tr><th>名前</th><th>得点</th><th>ウマ</th><th>勝点</th></tr>
        </thead>
        <tbody id="p2InputBody"></tbody>
      </table>
    </div>
    <div class="d-flex gap-2 mb-2">
      <button id="btnOcr" class="btn btn-sm btn-outline-secondary">画像から入力</button>
      <input type="file" id="ocrFileInput" accept="image/*" capture="environment" class="d-none">
    </div>
    <div class="row g-2 align-items-center mb-3">
      <div class="col-auto"><label class="col-form-label">倍率</label></div>
      <div class="col-3">
        <input type="number" id="multiplier" class="form-control" value="3" inputmode="numeric" min="1">
      </div>
    </div>
    <button id="btnConfirm" class="btn btn-primary w-100 mb-4" disabled>得点確定</button>

    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="fw-bold">確定済みの局</span>
      <button id="btnToggle" class="btn btn-sm btn-outline-secondary">切替</button>
    </div>
    <div class="table-responsive mb-3">
      <table class="table table-sm table-bordered mb-0">
        <thead class="table-light"><tr id="roundsHeader"></tr></thead>
        <tbody id="roundsBody"></tbody>
      </table>
    </div>
    <button id="btnEndGame" class="btn btn-success w-100" disabled>ゲーム終了</button>
  </div>

  <!-- Page 3: 精算 -->
  <div id="page3" class="container py-3 d-none">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="fw-bold small">局結果</span>
      <button id="btnToggle3" class="btn btn-sm btn-primary">切替</button>
    </div>
    <div class="table-responsive mb-3">
      <table class="table table-sm table-bordered mb-0">
        <thead class="table-light"><tr id="p3RoundsHeader"></tr></thead>
        <tbody id="p3RoundsBody"></tbody>
      </table>
    </div>

    <div id="p3ConfirmedList"></div>
    <h6 id="p3PhaseLabel" class="fw-bold mb-2"></h6>
    <div class="row g-2 align-items-center mb-2">
      <div class="col-auto"><label class="col-form-label">総額</label></div>
      <div class="col-4">
        <input type="number" id="p3TotalInput" class="form-control" inputmode="numeric" min="1" placeholder="0">
      </div>
      <div class="col-auto"><span class="col-form-label">円</span></div>
    </div>
    <div class="d-flex align-items-center gap-2 mb-3">
      <span class="small">丸め単位</span>
      <div class="btn-group btn-group-sm">
        <button class="btn btn-secondary round-unit-btn" data-unit="1">なし</button>
        <button class="btn btn-outline-secondary round-unit-btn" data-unit="10">1円</button>
        <button class="btn btn-outline-secondary round-unit-btn" data-unit="100">10円</button>
        <button class="btn btn-outline-secondary round-unit-btn" data-unit="1000">100円</button>
      </div>
    </div>
    <div class="table-responsive mb-3">
      <table class="table table-sm table-bordered mb-0">
        <thead class="table-light">
          <tr><th></th><th class="text-end">単純割</th><th>調整</th><th class="text-end">合計</th><th class="text-center">支払い</th></tr>
        </thead>
        <tbody id="p3SettleBody"></tbody>
        <tfoot class="table-light">
          <tr>
            <td>合計</td><td></td>
            <td class="text-end" id="p3Shortfall"></td>
            <td class="text-end fw-bold" id="p3GrandTotal"></td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <button id="btnConfirmPage3" class="btn btn-primary w-100 mb-3" disabled>金額確定</button>
    <div class="table-responsive">
      <table class="table table-sm table-bordered mb-0">
        <thead class="table-light"><tr id="p3SummaryHeader"></tr></thead>
        <tbody id="p3SummaryBody"></tbody>
      </table>
    </div>
  </div>

  <!-- OCR割り当てダイアログ -->
  <div id="ocrOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1050;align-items:center;justify-content:center;">
    <div style="position:relative;max-width:100vw;max-height:100vh;">
      <img id="ocrPreviewImg" style="display:block;max-width:100vw;max-height:90vh;object-fit:contain;">
      <div id="ocrDropdowns"></div>
      <button id="btnOcrOk" class="btn btn-primary btn-sm" disabled
              style="position:absolute;bottom:8px;right:8px;">OK</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
