<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麻雀成績入力</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Page 1: 設定 -->
  <div id="page1" class="container py-3">
    <h1 class="h4 mb-4">麻雀成績入力</h1>

    <div class="mb-4">
      <label class="form-label small text-muted">GAS URL</label>
      <input type="url" id="gasUrl" class="form-control form-control-sm"
             placeholder="https://script.google.com/macros/s/...">
    </div>

    <div class="mb-3">
      <label class="form-label">日付</label>
      <input type="date" id="date" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">プレイヤー</label>
      <div class="row g-2">
        <div class="col-6"><input type="text" id="player0" class="form-control" placeholder="プレイヤー1"></div>
        <div class="col-6"><input type="text" id="player1" class="form-control" placeholder="プレイヤー2"></div>
        <div class="col-6"><input type="text" id="player2" class="form-control" placeholder="プレイヤー3"></div>
        <div class="col-6"><input type="text" id="player3" class="form-control" placeholder="プレイヤー4"></div>
      </div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-6">
        <label class="form-label">ウマ1（1位⇔4位）</label>
        <input type="number" id="uma1" class="form-control" value="10" inputmode="numeric">
      </div>
      <div class="col-6">
        <label class="form-label">ウマ2（2位⇔3位）</label>
        <input type="number" id="uma2" class="form-control" value="5" inputmode="numeric">
      </div>
    </div>

    <button id="btnStart" class="btn btn-primary w-100">ゲーム開始</button>
  </div>

  <!-- Page 2: 素点入力（スタブ） -->
  <div id="page2" class="container py-3 d-none">
    <h1 class="h5 mb-1" id="p2Date"></h1>
    <p class="mb-3">
      <a id="p2SheetUrl" href="#" target="_blank" class="small">スプレッドシートを開く →</a>
    </p>
    <p class="text-muted">（2ページ目は準備中）</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
